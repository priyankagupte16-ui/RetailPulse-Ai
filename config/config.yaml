# RetailPulse AI Global Configuration

project:
  name: RetailPulse-AI
  version: 0.1.0
  description: Retail Demand Forecasting & Inventory Optimization Platform

forecasting:
  forecast_horizon_days: 14
  lag_windows: [1, 2, 7, 14, 21, 28]
  rolling_windows: [7, 14, 28]
  quantiles: [0.10, 0.50, 0.90]

inventory:
  default_service_level: 0.95
  default_lead_time_days: 7
  holding_cost_rate: 0.20
  stockout_penalty_multiplier: 1.5
