version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    env_file:
      - .env.example
    ports:
      - "${FASTAPI_PORT:-8000}:8000"
    restart: unless-stopped
    volumes:
      - .:/app

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    env_file:
      - .env.example
    ports:
      - "${DASHBOARD_PORT:-8501}:8501"
    restart: unless-stopped
    depends_on:
      - api
    volumes:
      - .:/app
